<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einzelampel</title>
<style>
:root{--bg1:#87ceeb;--bg2:#87ceeb;--ground:#87ceeb;--ink:#12324a;--mute:#25506f;--hous:#1a1e1c;--off:#2b302d;--r:#ef4444;--y:#fbbf24;--g:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f2a4a;--bg2:#0f2a4a;--ground:#0f2a4a;--ink:#e8ece9;--mute:#9aa49e;--hous:#050606;--off:#222725}}
:root[data-theme="dark"]{--bg1:#0f2a4a;--bg2:#0f2a4a;--ground:#0f2a4a;--ink:#e8ece9;--mute:#9aa49e;--hous:#050606;--off:#222725}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg1);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.pole{display:flex;flex-direction:column;align-items:center}
.box{background:linear-gradient(145deg,#2a302d,var(--hous) 60%);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.08)}
.l{width:92px;height:92px;border-radius:50%;background:var(--off);box-shadow:inset 0 6px 10px rgba(0,0,0,.6);transition:background .25s,box-shadow .25s}
.l.on.r{background:radial-gradient(circle at 35% 30%,#ff9a9a,var(--r) 55%);box-shadow:0 0 50px var(--r)}
.l.on.y{background:radial-gradient(circle at 35% 30%,#fff1a8,var(--y) 55%);box-shadow:0 0 50px var(--y)}
.l.on.g{background:radial-gradient(circle at 35% 30%,#b5ffe0,var(--g) 55%);box-shadow:0 0 50px var(--g)}
.stem{width:18px;height:90px;background:linear-gradient(90deg,#2a302d,var(--hous));border-radius:0 0 3px 3px}
#t{margin:0;font-weight:600;min-height:1.4em}
.hint{margin:0;color:var(--mute);font-size:14px}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.18);border:1.5px solid var(--mute);border-radius:12px;padding:10px 18px;min-height:44px;cursor:pointer}
button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#1d2421}
button:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.l{display:flex;align-items:center;justify-content:center;font:700 54px/1 system-ui,sans-serif;color:rgba(0,0,0,.6)}
#cw{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:min(150px,38vw);border-radius:12px;overflow:hidden;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.4);background:#000}
#cw[hidden]{display:none}
#vd{width:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%}
#cs{max-width:320px;text-align:center}
button:disabled{opacity:.45}
</style>
</head>
<body>
<div class="pole" aria-hidden="true"><div class="box"><div class="l r" id="r"></div><div class="l y" id="y"></div><div class="l g" id="g"></div></div><div class="stem"></div></div>
<p id="t" role="status">Rot</p>
<p class="hint" id="h">Tippe irgendwo, um zu schalten</p>
<button id="n" aria-pressed="false">Nachtmodus</button>
<button id="cm" aria-pressed="false">Kamera-Erkennung</button>
<button id="ab" aria-pressed="false" hidden>Pfeil-Erkennung: aus</button>
<div id="cw" hidden><video id="vd" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<p class="hint" id="cs" role="status"></p>
<script>
(function(){
var st='red',busy=false,night=false,tm=null,bl=null;
var L={r:document.getElementById('r'),y:document.getElementById('y'),g:document.getElementById('g')};
var t=document.getElementById('t'),h=document.getElementById('h'),n=document.getElementById('n');
function show(r,y,g,txt){L.r.classList.toggle('on',r);L.y.classList.toggle('on',y);L.g.classList.toggle('on',g);t.textContent=txt;if(!camOn){L.r.textContent=L.y.textContent=L.g.textContent='';}}
function go(){
  if(busy||night||camOn)return;busy=true;
  if(st=='red'){
    show(1,1,0,'Rot-Gelb');
    tm=setTimeout(function(){st='green';show(0,0,1,'Grün');busy=false;},1500);
  }else{
    show(0,1,0,'Gelb');
    tm=setTimeout(function(){st='red';show(1,0,0,'Rot');busy=false;},3000);
  }
}
document.body.addEventListener('click',go);
n.addEventListener('click',function(e){
  e.stopPropagation();if(camOn)return;night=!night;n.setAttribute('aria-pressed',night);
  clearTimeout(tm);clearInterval(bl);busy=false;
  if(night){
    n.textContent='Nachtmodus beenden';h.textContent='Gelb blinkt – Tippen ist pausiert';
    var on=true;show(0,1,0,'Nachtmodus');
    bl=setInterval(function(){on=!on;show(0,on,0,'Nachtmodus');},700);
  }else{
    n.textContent='Nachtmodus';h.textContent='Tippe irgendwo, um zu schalten';
    st='red';show(1,0,0,'Rot');
  }
});
var camOn=false,stream=null,vd=document.getElementById('vd'),ovc=document.getElementById('ov'),cw=document.getElementById('cw'),cs=document.getElementById('cs'),cm=document.getElementById('cm'),ab=document.getElementById('ab'),arrowOn=false,an=document.createElement('canvas'),ax=null,loop=null,hist=[],ev=[];
an.width=160;an.height=120;
function cls(r,g,b){
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(mx<150||d<70||d/mx<.45)return 0;
  var q;if(mx==r)q=((g-b)/d+6)%6;else if(mx==g)q=(b-r)/d+2;else q=(r-g)/d+4;q*=60;
  if(q<18||q>340)return 1;if(q>38&&q<68)return 2;if(q>95&&q<185)return 3;return 0;}
function analyze(D){
  var m=new Uint8Array(19200),i,seen=new Uint8Array(19200),best=[null,null,null,null],stack=new Int32Array(19200);
  for(i=0;i<19200;i++)m[i]=cls(D[i*4],D[i*4+1],D[i*4+2]);
  for(i=0;i<19200;i++){var c=m[i];if(!c||seen[i])continue;
    var sp=0,a=0,x0=999,y0=999,x1=-1,y1=-1;stack[sp++]=i;seen[i]=1;
    while(sp){var p=stack[--sp],px=p%160,py=(p/160)|0;a++;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      if(px>0&&!seen[p-1]&&m[p-1]==c){seen[p-1]=1;stack[sp++]=p-1;}
      if(px<159&&!seen[p+1]&&m[p+1]==c){seen[p+1]=1;stack[sp++]=p+1;}
      if(py>0&&!seen[p-160]&&m[p-160]==c){seen[p-160]=1;stack[sp++]=p-160;}
      if(py<119&&!seen[p+160]&&m[p+160]==c){seen[p+160]=1;stack[sp++]=p+160;}}
    if(!best[c]||a>best[c].a)best[c]={a:a,x0:x0,y0:y0,x1:x1,y1:y1,c:c};}
  return{best:best,m:m};}
function arrowOf(o,m){
  var w=o.x1-o.x0+1,ht=o.y1-o.y0+1;if(o.a/(w*ht)>.64||w<6||ht<6)return'';
  var col=[],row=[],x,y;for(x=0;x<w;x++)col[x]=0;for(y=0;y<ht;y++)row[y]=0;
  for(y=0;y<ht;y++)for(x=0;x<w;x++)if(m[(o.y0+y)*160+o.x0+x]==o.c){col[x]++;row[y]++;}
  function av(arr,a,b){var s=0;for(var k=a;k<b;k++)s+=arr[k];return s/Math.max(1,b-a);}
  var kw=Math.max(1,Math.round(w*.2)),kh=Math.max(1,Math.round(ht*.2));
  var L=av(col,0,kw),Rr=av(col,w-kw,w),T=av(row,0,kh),Bo=av(row,ht-kh,ht);
  var hx=(Rr-L)/(Rr+L+.01),vy=(Bo-T)/(Bo+T+.01);
  if(Math.max(Math.abs(hx),Math.abs(vy))<.18)return'';
  return Math.abs(hx)>=Math.abs(vy)?(hx>0?'←':'→'):(vy>0?'↑':'↓');}
function decide(r){
  var b=r.best;function ok(o){if(!o||o.a<14)return null;var w=o.x1-o.x0+1,ht=o.y1-o.y0+1,q=w/ht;return(q>.4&&q<2.5&&o.a/(w*ht)>.25)?o:null;}
  var Rd=ok(b[1]),Y=ok(b[2]),Gn=ok(b[3]),pick=null,s='none';
  if(Rd&&Y&&Math.min(Rd.a,Y.a)>=Math.max(Rd.a,Y.a)*.3&&Math.abs((Rd.x0+Rd.x1)-(Y.x0+Y.x1))<(Rd.x1-Rd.x0+Y.x1-Y.x0+2)){s='ry';pick=Rd;}
  else{var l=[[Rd,'red'],[Y,'yellow'],[Gn,'green']].filter(function(e){return e[0];}).sort(function(p,q){return q[0].a-p[0].a;})[0];if(l){pick=l[0];s=l[1];}}
  return{s:s,ar:arrowOn&&pick&&s!='ry'?arrowOf(pick,r.m):'',box:pick};}
function apply(s,ar){
  var map={none:[0,0,0,'Keine Ampel erkannt'],red:[1,0,0,'Rot'],yellow:[0,1,0,'Gelb'],green:[0,0,1,'Grün'],ry:[1,1,0,'Rot-Gelb']},o=map[s];
  show(o[0],o[1],o[2],o[3]+(ar?' mit Pfeil '+ar:''));
  if(ar)(s=='green'?L.g:s=='yellow'?L.y:L.r).textContent=ar;}
function nightSeen(nw){
  if(ev.length<14||nw-ev[0][0]<2500)return false;
  var Y=0,N=0,O=0,sw=0,pv=null;
  ev.forEach(function(e){var k=e[1]=='yellow'?'y':e[1]=='none'?'n':'o';if(k=='y')Y++;else if(k=='n')N++;else O++;if(k!='o'){if(pv&&k!=pv)sw++;pv=k;}});
  return O==0&&Y>=3&&N>=3&&sw>=2;}
function step(){
  if(vd.readyState<2)return;
  ax.drawImage(vd,0,0,160,120);var r=analyze(ax.getImageData(0,0,160,120).data),d=decide(r),nw=performance.now();ev.push([nw,d.s]);while(ev.length&&nw-ev[0][0]>4000)ev.shift();
  drawOv(r,d,nw);
  hist.push(d.s+'|'+d.ar);if(hist.length>6)hist.shift();
  var cnt={},top=null;hist.forEach(function(e){cnt[e]=(cnt[e]||0)+1;if(!top||cnt[e]>cnt[top])top=e;});
  if(nightSeen(nw))show(0,d.s=='yellow',0,'Nachtmodus erkannt (Gelb blinkt)');
  else if(cnt[top]>=3){var p=top.split('|');apply(p[0],p[1]);}}
function enter(msg){
  camOn=true;clearTimeout(tm);clearInterval(bl);busy=false;night=false;n.setAttribute('aria-pressed','false');n.textContent='Nachtmodus';n.disabled=true;
  cw.hidden=false;cm.setAttribute('aria-pressed','true');cm.textContent='Kamera-Erkennung beenden';ab.hidden=false;h.textContent=msg;cs.textContent='';
  ax=an.getContext('2d',{willReadFrequently:true});hist=[];ev=[];show(0,0,0,'Suche Ampel …');loop=setInterval(step,80);}
function drawOv(r,d){var cx=ovc.getContext('2d'),W=ovc.width=vd.clientWidth;ovc.height=vd.clientHeight;if(d.box){var k=W/160;cx.strokeStyle='#fff';cx.lineWidth=3;cx.strokeRect(d.box.x0*k-3,d.box.y0*k-3,(d.box.x1-d.box.x0+1)*k+6,(d.box.y1-d.box.y0+1)*k+6);}
  var mx=W/2,my=ovc.height/2;cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1;cx.beginPath();cx.moveTo(mx-8,my);cx.lineTo(mx+8,my);cx.moveTo(mx,my-8);cx.lineTo(mx,my+8);cx.stroke();}
function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){cs.textContent='Kamera nicht verfügbar. Öffne die Seite direkt im Browser und erlaube die Kamera.';return;}
  cs.textContent='Kamera wird gestartet …';
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false}).then(function(sm){
    stream=sm;vd.srcObject=sm;vd.loop=false;if(vd.play)vd.play();enter('Halte die Kamera auf eine Ampel (ein Licht gut sichtbar).');
  }).catch(function(err){cs.textContent='Kamera nicht erlaubt oder nicht verfügbar ('+((err&&err.name)||'Fehler')+'). Öffne die Seite direkt im Browser und erlaube die Kamera.';});}
function stopCam(){
  clearInterval(loop);if(stream)stream.getTracks().forEach(function(tk){tk.stop();});stream=null;vd.srcObject=null;camOn=false;cw.hidden=true;ab.hidden=true;
  cm.setAttribute('aria-pressed','false');cm.textContent='Kamera-Erkennung';n.disabled=false;h.textContent='Tippe irgendwo, um zu schalten';cs.textContent='';st='red';show(1,0,0,'Rot');}
cm.addEventListener('click',function(e){e.stopPropagation();if(camOn)stopCam();else startCam();});
cw.addEventListener('click',function(e){e.stopPropagation();});
ab.addEventListener('click',function(e){e.stopPropagation();arrowOn=!arrowOn;ab.setAttribute('aria-pressed',arrowOn);ab.textContent='Pfeil-Erkennung: '+(arrowOn?'an':'aus');hist=[];});
show(1,0,0,'Rot');
})();
</script>
</body>
</html>
